name: Generate Snake Animation

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23F7A9C4&color_dots=%233A2630,%235A1537,%237A3154,%23B85C7A,%23FAD6E3
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=%23B85C7A&color_dots=%23F5E9EE,%23F7C4D6,%23F7A9C4,%23D982A2,%235A1537

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
